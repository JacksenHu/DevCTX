<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7A9FD8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3FA083"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#F4F3EE" rx="16"/>

  <!-- Title -->
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1A1B1C">跨 IDE 无缝开发 · 统一上下文协议</text>
  <text x="40" y="82" font-size="15" fill="#6B7280">把易失的对话记忆，外置成项目内所有 AI 工具共享的一套文件 —— 换工具、换模型不再重读全仓</text>

  <!-- Left: tools -->
  <text x="40" y="128" font-size="14" font-weight="600" fill="#6B7280">AI 编程工具（想用几个用几个）</text>
  <g font-size="15" fill="#1A1B1C">
    <rect x="40" y="142" width="226" height="52" rx="10" fill="#FFFFFF" stroke="#E4E3DD"/>
    <text x="58" y="174">Trae / Trae Work CN</text>
    <rect x="40" y="202" width="226" height="52" rx="10" fill="#FFFFFF" stroke="#E4E3DD"/>
    <text x="58" y="234">Cursor</text>
    <rect x="40" y="262" width="226" height="52" rx="10" fill="#FFFFFF" stroke="#E4E3DD"/>
    <text x="58" y="294">Claude Code</text>
    <rect x="40" y="322" width="226" height="52" rx="10" fill="#FFFFFF" stroke="#E4E3DD"/>
    <text x="58" y="354">Windsurf / Copilot</text>
    <rect x="40" y="382" width="226" height="52" rx="10" fill="#FFFFFF" stroke="#E4E3DD"/>
    <text x="58" y="414">Cline / Roo / Gemini</text>
    <rect x="40" y="442" width="226" height="52" rx="10" fill="#FFFFFF" stroke="#E4E3DD"/>
    <text x="58" y="474">Codex / Aider …</text>
  </g>
  <g font-size="12" fill="#8A93A6">
    <text x="250" y="174" text-anchor="end">薄指针</text>
    <text x="250" y="234" text-anchor="end">薄指针</text>
    <text x="250" y="294" text-anchor="end">薄指针</text>
    <text x="250" y="354" text-anchor="end">薄指针</text>
    <text x="250" y="414" text-anchor="end">薄指针</text>
    <text x="250" y="474" text-anchor="end">薄指针</text>
  </g>

  <g stroke="#7A9FD8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M268,168 C300,168 300,210 336,210"/>
    <path d="M268,288 C312,288 300,300 336,300"/>
    <path d="M268,468 C300,468 300,392 336,392"/>
  </g>

  <!-- Center: .ai-dev -->
  <rect x="336" y="120" width="470" height="410" rx="14" fill="#FFFFFF" stroke="#9BBBF4" stroke-width="2"/>
  <text x="358" y="156" font-size="19" font-weight="700" fill="#1A1B1C">.ai-dev/ 单一事实源</text>
  <text x="784" y="156" font-size="12" fill="#6B7280" text-anchor="end">规则只维护这一份</text>

  <rect x="358" y="172" width="426" height="66" rx="10" fill="#EAF1FE" stroke="#9BBBF4"/>
  <text x="376" y="200" font-size="15" font-weight="700" fill="#2B4C8C">L1 入口 · 每个新会话必读</text>
  <text x="376" y="224" font-size="13.5" fill="#3A4763">START_HERE.md — 加载协议、文件地图、Token 纪律</text>

  <rect x="358" y="250" width="426" height="118" rx="10" fill="#FBFBF8" stroke="#E4E3DD"/>
  <text x="376" y="278" font-size="15" font-weight="700" fill="#5B6472">L2 长期记忆 · 遇到对应问题才读</text>
  <text x="376" y="304" font-size="13.5" fill="#3A4763">project-brief.md　项目定位 / 技术栈 / 命令</text>
  <text x="376" y="328" font-size="13.5" fill="#3A4763">architecture.md　模块地图 / “改什么去哪改”</text>
  <text x="376" y="352" font-size="13.5" fill="#3A4763">conventions.md · code-index.md（代码地图）</text>

  <rect x="358" y="380" width="426" height="96" rx="10" fill="#EAF1FE" stroke="#9BBBF4"/>
  <text x="376" y="408" font-size="15" font-weight="700" fill="#2B4C8C">L3 工作记忆 · 每个新会话必读</text>
  <text x="376" y="432" font-size="13.5" fill="#3A4763">HANDOFF.md — 进度 / 下一步 / 陷阱 / 改动清单</text>
  <text x="376" y="456" font-size="13.5" fill="#3A4763">decisions/ — 重大决策记录 ADR</text>

  <rect x="358" y="490" width="426" height="26" rx="8" fill="#F0F5FF"/>
  <text x="571" y="508" font-size="13" font-weight="600" fill="#2B4C8C" text-anchor="middle">新会话固定开销 ≈ 1000 tokens（只读 L1 + L3）</text>

  <!-- Right: token compare -->
  <rect x="850" y="120" width="312" height="410" rx="14" fill="#FFFFFF" stroke="#E4E3DD"/>
  <text x="872" y="156" font-size="17" font-weight="700" fill="#1A1B1C">为什么省 Token</text>

  <rect x="872" y="174" width="268" height="118" rx="10" fill="#FBEAEA"/>
  <text x="890" y="202" font-size="14" font-weight="700" fill="#B4444C">旧路线</text>
  <text x="890" y="228" font-size="13" fill="#8A3A40">每换一个工具 / 模型</text>
  <text x="890" y="250" font-size="13" fill="#8A3A40">全仓遍历、逐个读源码猜结构</text>
  <text x="890" y="272" font-size="13" fill="#8A3A40">上下文反复燃烧，还重踩旧坑</text>

  <path d="M1006,298 L1006,322" stroke="#3FA083" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="872" y="328" width="268" height="118" rx="10" fill="#E7F4EF"/>
  <text x="890" y="356" font-size="14" font-weight="700" fill="#2F7D66">新路线</text>
  <text x="890" y="382" font-size="13" fill="#2C6B58">读 L1+L3 约 1000 token 恢复现场</text>
  <text x="890" y="404" font-size="13" fill="#2C6B58">按 code-index 定位，只读目标文件</text>
  <text x="890" y="426" font-size="13" fill="#2C6B58">交接只传状态，不传对话过程</text>

  <g font-size="12.5" fill="#5B6472">
    <circle cx="884" cy="468" r="3.5" fill="#94D8C3"/>
    <text x="894" y="472">一份规则，N 个工具同时生效</text>
    <circle cx="884" cy="492" r="3.5" fill="#94D8C3"/>
    <text x="894" y="496">索引定位，替代盲扫</text>
    <circle cx="884" cy="516" r="3.5" fill="#94D8C3"/>
    <text x="894" y="520">doctor 体检，防止上下文腐化</text>
  </g>

  <!-- Bottom loop -->
  <text x="40" y="588" font-size="14" font-weight="600" fill="#6B7280">日常闭环（AI 自动执行，用户零命令）</text>
  <g font-size="14.5" font-weight="600" fill="#2B4C8C">
    <rect x="40" y="604" width="220" height="58" rx="29" fill="#EAF1FE" stroke="#9BBBF4"/>
    <text x="150" y="639" text-anchor="middle">① Resume 自动恢复现场</text>
    <rect x="490" y="604" width="220" height="58" rx="29" fill="#EAF1FE" stroke="#9BBBF4"/>
    <text x="600" y="639" text-anchor="middle">② Develop 按索引改码</text>
    <rect x="940" y="604" width="220" height="58" rx="29" fill="#EAF1FE" stroke="#9BBBF4"/>
    <text x="1050" y="639" text-anchor="middle">③ Handoff 压缩交接</text>
  </g>
  <g stroke="#7A9FD8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M266,633 L482,633"/>
    <path d="M716,633 L932,633"/>
  </g>
  <path d="M1050,662 C1050,694 150,694 150,662" stroke="#B9CDEC" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="708" font-size="12.5" fill="#8A93A6" text-anchor="middle">切换 IDE 或模型时闭环：新工具从 ③ 的交接状态继续，如同同一个 AI 从未离开</text>
</svg>
