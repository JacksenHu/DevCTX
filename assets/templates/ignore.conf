# code-index 扫描忽略规则（glob，每行一条；# 开头为注释）
# 语法：* 匹配单层任意字符，** 匹配任意层级，目录以 / 结尾
# 同时会自动读取 .gitignore；这里只补充 .gitignore 没覆盖的噪音

